name: Inventory Manager CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-manager-production
  cancel-in-progress: false

jobs:
  # ========================================
  # CI - Build Docker images
  # ========================================
  ci:
    name: CI - Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t inventory-manager-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t inventory-manager-frontend:ci \
            ./frontend

  # ========================================
  # CD - Deploy to Ubuntu VM
  # ========================================
  deploy:
    name: CD - Deploy to Ubuntu
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Connect GitHub Actions to Tailscale
      # ----------------------------------------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ----------------------------------------
      # Configure SSH
      # ----------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ----------------------------------------
      # Deploy to Ubuntu
      # ----------------------------------------
      - name: Deploy to Ubuntu
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ~/.ssh/deploy_key

        run: |
          ssh -i "$SSH_KEY" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_DIR="$HOME/inventory-manager"

          cd "$APP_DIR"

          echo "======================================"
          echo "Starting deployment"
          echo "======================================"

          # Save currently deployed commit
          CURRENT_COMMIT=$(git rev-parse HEAD)

          echo "$CURRENT_COMMIT" > .previous_commit

          echo "Previous commit: $CURRENT_COMMIT"

          # ----------------------------------------
          # Pull latest code
          # ----------------------------------------

          echo "Pulling latest code..."

          git fetch origin main

          git reset --hard origin/main

          echo "New commit:"
          git rev-parse HEAD

          # ----------------------------------------
          # Validate Docker Compose
          # ----------------------------------------

          echo "Validating Docker Compose configuration..."

          docker compose config -q

          # ----------------------------------------
          # Build Docker images
          # ----------------------------------------

          echo "Building Docker images..."

          docker compose build

          # ----------------------------------------
          # Start containers
          # ----------------------------------------

          echo "Starting containers..."

          docker compose up -d --remove-orphans

          # ----------------------------------------
          # Show container status
          # ----------------------------------------

          echo "Container status:"

          docker compose ps

          # ----------------------------------------
          # Backend health check
          # ----------------------------------------

          echo "Checking backend health..."

          for i in {1..30}; do
            if curl -fsS http://localhost:3001/health; then
              echo ""
              echo "Backend is healthy."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo ""
              echo "Backend health check failed."
              exit 1
            fi

            echo "Backend not ready. Attempt $i/30..."

            sleep 2
          done

          echo ""
          echo "======================================"
          echo "Deployment completed successfully"
          echo "======================================"

          REMOTE_SCRIPT

      # ----------------------------------------
      # Cleanup SSH private key
      # ----------------------------------------
      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key